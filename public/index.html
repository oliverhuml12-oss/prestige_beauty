<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prestige Beauty – již brzy</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f6f1ec; --ink: #2b2420; --muted: #6b5d53; --accent: #8a6a4e; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    main { max-width: 34rem; }
    .mark {
      font-family: "Cormorant Garamond", serif;
      font-size: 0.85rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: clamp(2.8rem, 9vw, 4.8rem);
      line-height: 1;
      margin-bottom: 1.5rem;
    }
    h1 em { font-style: italic; color: var(--accent); }
    .rule { width: 3rem; height: 1px; background: var(--accent); margin: 0 auto 1.5rem; }
    p { color: var(--muted); line-height: 1.7; font-size: 1rem; }
    footer { margin-top: 3rem; font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="mark">Prestige Beauty</div>
    <h1>Již <em>brzy</em></h1>
    <div class="rule"></div>
    <p>Připravujeme pro vás nový web. Brzy se tu uvidíme.</p>
    <footer>&copy; 2026 Prestige Beauty</footer>
  </main>
</body>
</html>
